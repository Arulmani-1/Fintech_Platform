<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY | 404 Error</title>
    
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .error-section {
            padding-top: 150px;
            padding-bottom: 100px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .error-code {
            font-size: 12rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #0ea98a, #1fe0b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(31, 224, 182, 0.2);
        }
        
        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .anim-jump {
            animation: jump 2s infinite ease-in-out;
            display: block;
        }

        @keyframes sideToSide {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
        .anim-side {
            animation: sideToSide 3s infinite ease-in-out;
            display: block;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }
            .error-section {
                padding-top: 100px;
                padding-bottom: 50px;
            }
        }
        
        @media (max-width: 480px) {
            .error-code {
                font-size: 6rem;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="preloader-placeholder"></div>
    
    <main class="flex-grow-1 d-flex align-items-center position-relative overflow-hidden">
        <div class="bg-blob blob-3"></div>
        <div class="bg-blob blob-1"></div>
        
        <div class="container" data-aos="fade-up">
            <div class="row justify-content-center">
                <div class="col-lg-8 text-center error-section">
                    <h1 class="error-code anim-jump">404</h1>
                    <h2 class="fw-bold mb-4 anim-side">Page Not Found</h2>
                    <p class="fs-5 mb-5 text-dark">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track to building the future.</p>
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a href="javascript:history.back()" class="btn btn-premium magnetic hover-lift d-inline-flex align-items-center gap-2" style="text-decoration: none;">
                            <i class="bi bi-arrow-left"></i> Go Back
                        </a>
                        <a href="home.html" class="btn btn-premium magnetic hover-lift d-inline-flex align-items-center gap-2" style="text-decoration: none;">
                            <i class="bi bi-house-door-fill"></i> Go to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/animations.js"></script>
</body>
</html>
